impacts:
  intro: "Mas alla de papers: formacion de estudiantes, transferencia y comunidad cientifica."
  human_capital_heading: Formacion de capital humano
  human_capital_prefix: "El laboratorio integra docencia e investigacion a traves de tesis de magister/doctorado y memorias de ingenieria en IA aplicada. En el periodo "
  human_capital_middle: " se registran "
  human_capital_suffix: " tesis de Magister con guia del laboratorio."
  interdisciplinary_heading: Aplicaciones interdisciplinarias
  interdisciplinary_text: Se desarrollan soluciones en astroinformatica y salud digital, incluyendo clasificacion de curvas de luz y supernovas, deteccion de novedades astronomicas, analisis de EEG del sueno/epilepsia, segmentacion en imagenes medicas y modelamiento con atencion/transformers.
  open_ecosystem_heading: Ecosistema abierto
  open_ecosystem_text: El sitio se construyo para facilitar extraccion estructurada por agentes AI y actualizacion colaborativa de contenidos.
  recent_theses_heading: Tesis recientes con guia del laboratorio
  commitment_heading: Compromiso
  commitment_text: Promovemos colaboracion entre estudiantes, investigadores y academicos de distintas areas para fortalecer la investigacion de frontera en inteligencia computacional.

